[project]
name = "caca-alucinacoes"
version = "1.0.0"
description = "Verificação de citações jurídicas em pareceres de IA (BRACIS 2026 x Jusbrasil)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.51",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# O texto de um prompt é literal e não comporta quebra de linha.
"src/prompts/*.py" = ["E501"]
# A célula do Kaggle só encontra os módulos depois de ajustar sys.path, e
# por isso os imports do projeto vêm abaixo dele, num bloco que a ordenação
# automática classificaria de outra forma conforme `src/` esteja ou não no
# caminho de quem roda a checagem.
"notebook_kaggle.py" = ["E402", "I001"]
