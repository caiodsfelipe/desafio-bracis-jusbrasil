name: testes

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: pip install pytest ruff
      - name: Suíte de regressão
        run: pytest tests/ -q
      - name: Análise estática
        run: ruff check src tests avaliar.py
