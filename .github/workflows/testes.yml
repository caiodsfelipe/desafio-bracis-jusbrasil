name: testes

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: pip install pytest ruff
      - name: Suíte de regressão
        run: pytest tests/ -q
      - name: Análise estática
        # Os scripts da organização (kaggle_metric.py, json_to_submission.py)
        # não entram: são material distribuído, não nosso a corrigir.
        run: >
          ruff check src tests
          ablacao.py avaliar.py comparar.py contraprova.py corpus.py
          empacotar.py generalizacao.py notebook_kaggle.py robustez.py
